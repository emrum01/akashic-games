name = "hon-lion-riddle"
main = "src/index.ts"
compatibility_date = "2026-10-01"
preview_urls = false
[assets]
directory = "../dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/turtle-soup/manor*"]
[vars]
JEV_MODEL = "jev-latest"
PROVISIONAL_SOLVED_CONFIDENCE = "0.9"

# Standalone trial host; does not attach or change games.escape-safari.com.
[env.staging]
name = "hon-lion-riddle-staging"
workers_dev = true
preview_urls = false
routes = []

[env.staging.vars]
JEV_MODEL = "jev-latest"
PROVISIONAL_SOLVED_CONFIDENCE = "0.9"

# The route wildcard is required for query strings, which Cloudflare route
# patterns cannot match separately. The Worker passes /manor-other and other
# near-matches through to the existing origin before serving this game.
[env.production]
name = "hon-lion-riddle"
workers_dev = false
routes = [{ pattern = "games.escape-safari.com/turtle-soup/manor*", zone_name = "escape-safari.com" }]

[env.production.vars]
JEV_MODEL = "jev-latest"
PROVISIONAL_SOLVED_CONFIDENCE = "0.9"
HON_LION_MOUNT_ONLY = "1"
