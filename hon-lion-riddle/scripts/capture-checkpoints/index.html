<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hon Lion checkpoint media capture</title>
  <script type="importmap">{"imports":{"three":"/vendor/build/three.module.js"}}</script>
  <style>
    html, body { margin:0; min-height:100%; background:#0b0a09; color:#f5eadb; font:14px system-ui,sans-serif; }
    body { display:grid; place-items:center; }
    main { width:min(96vw, 1280px); padding:14px; box-sizing:border-box; }
    canvas { display:block; width:100%; height:auto; background:#0b0a09; border:1px solid #3e3127; }
    #status { margin:8px 0 0; color:#d9b888; min-height:1.3em; }
  </style>
</head>
<body>
  <main>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
      <label>画角 <select id="profile"><option value="wide">横画面</option><option value="portrait">縦画面</option></select></label>
      <label>確認
        <select id="preview-scene">
          <option value="hall">導入: 玄関ホール</option>
          <option value="entrance">手順1: 室内の入口</option>
          <option value="rear-door-ready">手順2: 奥の扉（施錠）</option>
          <option value="cross">手順3: 十字の穴と金の鍵</option>
          <option value="cabinet-key">手順4: キャビネットの金の鍵</option>
          <option value="cabinet-open">手順4: 開いたキャビネット</option>
          <option value="armed">手順4: 銃と銀の十字鍵</option>
          <option value="rear-door-ready">手順5: 奥の扉へ戻る</option>
        </select>
      </label>
      <button id="preview-scene-button">選択画を表示</button>
      <label>開錠 <input id="unlock-progress" type="range" min="0" max="100" value="0"></label>
      <button id="preview-unlock">開錠を再生・保存</button>
      <button id="save-frame">静止画を保存</button>
      <button id="capture-all">全シーンを書き出す</button>
    </div><canvas id="scene"></canvas>
    <div id="status">loading…</div>
  </main>
  <script type="module" src="/capture-harness.js"></script>
</body>
</html>
