    <style>
      :root {
        --ink: #e8edf2;
        --muted: #8f9aa8;
        --panel: rgba(12, 16, 22, 0.86);
        --panel-strong: rgba(7, 10, 15, 0.94);
        --line: rgba(232, 237, 242, 0.13);
        --accent: #66d3ff;
        --danger: #ff4f6d;
        --paper: #e2d1a4;
        --wood: #3a2519;
        --tatami-a: #8a8f65;
        --tatami-b: #b6b57f;
        color-scheme: dark;
      }

      @property --chat-alpha {
        syntax: "<number>";
        inherits: true;
        initial-value: 0.52;
      }

      @property --chrome-alpha {
        syntax: "<number>";
        inherits: true;
        initial-value: 0.68;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
      }

      body {
        min-height: 100%;
        overflow: hidden;
        background: #12151a;
        color: var(--ink);
        font-family: var(--font-body);
        letter-spacing: 0;
        overscroll-behavior: none;
        font-size: var(--game-ui-font-size-md);
        line-height: var(--game-ui-line-height);
      }

      button,
      input {
        font: inherit;
        touch-action: manipulation;
      }

      .room {
        position: fixed;
        inset: 0;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px) 0 0 / 96px 100%,
          radial-gradient(circle at 50% 22%, rgba(255, 230, 159, 0.11), transparent 32%),
          linear-gradient(180deg, #241a15 0 58%, #15171a 58% 100%);
        isolation: isolate;
      }

      .room::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 42%;
        background:
          linear-gradient(90deg, rgba(18, 24, 19, 0.45) 1px, transparent 1px) 0 0 / 16.66% 100%,
          linear-gradient(0deg, rgba(18, 24, 19, 0.45) 1px, transparent 1px) 0 0 / 100% 50%,
          repeating-linear-gradient(
            90deg,
            var(--tatami-a),
            var(--tatami-a) 4px,
            var(--tatami-b) 4px,
            var(--tatami-b) 8px
          );
        transform: perspective(780px) rotateX(58deg);
        transform-origin: bottom;
        opacity: 0.72;
        filter: saturate(0.72) brightness(0.78);
      }

      .kakejiku {
        position: absolute;
        left: 50%;
        top: 5vh;
        width: min(34vw, 380px);
        min-width: 210px;
        height: min(58vh, 560px);
        transform: translateX(-50%);
        opacity: 1;
        filter: contrast(1.08);
        pointer-events: none;
      }

      .kakejiku::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            90deg,
            rgba(95, 59, 33, 0.88),
            rgba(228, 211, 169, 0.92) 7% 93%,
            rgba(83, 50, 30, 0.88)
          ),
          repeating-linear-gradient(
            0deg,
            rgba(50, 36, 23, 0.08),
            rgba(50, 36, 23, 0.08) 1px,
            transparent 1px,
            transparent 9px
          );
        border-left: 12px solid rgba(45, 28, 18, 0.92);
        border-right: 12px solid rgba(45, 28, 18, 0.92);
        box-shadow: 0 26px 80px rgba(0, 0, 0, 0.42);
      }

      .kakejiku::after {
        content: "";
        position: absolute;
        left: -20px;
        right: -20px;
        top: -10px;
        height: 14px;
        border-radius: 999px;
        background: linear-gradient(90deg, #22140d, #79502c 22% 78%, #22140d);
        box-shadow: 0 calc(min(58vh, 560px) + 10px) 0 #2a180f;
      }

      .scroll-text {
        position: absolute;
        inset: 16% 18%;
        display: grid;
        place-items: center;
        color: rgba(23, 18, 15, 0.86);
        font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
        font-size: clamp(2.2rem, 5vw, 4.6rem);
        font-weight: 700;
        line-height: 1.45;
        writing-mode: vertical-rl;
        text-orientation: upright;
        text-shadow: 0 0 8px rgba(32, 22, 12, 0.22);
      }

      .app {
        position: relative;
        z-index: 2;
        min-height: 100%;
        display: block;
        padding: 0;
      }

      .remaining {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 36px;
        padding: 7px 12px;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: #f2f6fa;
        font-size: 0.92rem;
      }

      .remaining strong {
        color: #ffffff;
        font-size: 1.02rem;
      }

      .chat-shell {
        --chat-alpha: 0.52;
        --chrome-alpha: 0.68;
        width: 100vw;
        height: 100vh;
        min-height: 100dvh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        border: 0;
        border-radius: 0;
        background: linear-gradient(
          180deg,
          rgba(12, 16, 22, var(--chat-alpha)),
          rgba(12, 16, 22, calc(var(--chat-alpha) - 0.08))
        );
        box-shadow: 0 30px 110px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(2px) saturate(0.9);
        overflow: hidden;
        animation: reveal-scroll 20s linear forwards;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 58px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
        background: rgba(5, 8, 12, calc(var(--chrome-alpha) - 0.56));
      }

      .agent {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        color: #f7fbff;
        font-weight: 650;
      }

      .agent-mark {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(102, 211, 255, 0.35);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(102, 211, 255, 0.26), rgba(102, 211, 255, 0.04));
        color: var(--accent);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.82rem;
      }

      .log {
        overflow-y: auto;
        padding: 26px clamp(16px, 4vw, 42px);
        scroll-behavior: smooth;
      }

      .message {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 12px;
        margin: 0 0 22px;
      }

      .avatar {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.13);
        background: rgba(255, 255, 255, 0.06);
        color: #ced8e5;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.76rem;
      }

      .bubble {
        max-width: 68ch;
        padding: 0;
        color: #eef3f8;
        line-height: 1.72;
        white-space: pre-line;
      }

      .message.user {
        grid-template-columns: minmax(0, 1fr) 34px;
      }

      .message.user .avatar {
        grid-column: 2;
        grid-row: 1;
        background: rgba(255, 255, 255, 0.12);
      }

      .message.user .bubble {
        justify-self: end;
        padding: 12px 14px;
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
      }

      .composer {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 10px;
        padding: 14px;
        border-top: 1px solid var(--line);
        background: rgba(7, 10, 15, var(--chrome-alpha));
      }

      .nav-btn,
      .send-btn,
      .icon-btn {
        min-height: 42px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.07);
        color: var(--ink);
        cursor: pointer;
        transition:
          transform 120ms ease,
          border-color 120ms ease,
          background 120ms ease;
      }

      .nav-btn {
        width: 42px;
        color: rgba(232, 237, 242, 0.78);
        font-size: 0.92rem;
      }

      .send-btn {
        width: 48px;
        background: rgba(102, 211, 255, 0.18);
        color: #dff7ff;
      }

      .icon-btn {
        width: 42px;
        color: rgba(232, 237, 242, 0.72);
      }

      .reset-btn {
        min-width: 82px;
        padding: 0 12px;
        color: rgba(232, 237, 242, 0.78);
        font-size: 0.86rem;
      }

      .nav-btn:hover,
      .send-btn:hover,
      .icon-btn:hover {
        transform: translateY(-1px);
        border-color: rgba(102, 211, 255, 0.44);
        background: rgba(102, 211, 255, 0.14);
      }

      .nav-btn:focus-visible,
      .send-btn:focus-visible,
      .icon-btn:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      input {
        min-width: 0;
        height: 42px;
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.06);
        color: #ffffff;
        padding: 0 14px;
      }

      input::placeholder {
        color: rgba(232, 237, 242, 0.46);
      }

      .control-room {
        position: relative;
        height: 100vh;
        height: 100dvh;
        display: block;
        padding: clamp(18px, 4vw, 48px);
        /* Prevent focus/scrollIntoView from panning the fixed 3D scene. */
        overflow: clip;
        background:
          radial-gradient(circle at 50% 38%, rgba(201, 157, 92, 0.24), transparent 38%),
          linear-gradient(180deg, rgba(16, 17, 18, 0.08), rgba(0, 0, 0, 0.46));
      }

      .control-room::before {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -22vh;
        width: 128vw;
        height: 58vh;
        transform: translateX(-50%) perspective(880px) rotateX(64deg);
        transform-origin: bottom;
        background:
          linear-gradient(90deg, rgba(211, 172, 108, 0.18) 1px, transparent 1px) 0 0 / 11vw 100%,
          linear-gradient(0deg, rgba(211, 172, 108, 0.14) 1px, transparent 1px) 0 0 / 100% 64px,
          linear-gradient(180deg, rgba(14, 12, 11, 0), rgba(0, 0, 0, 0.48));
        opacity: 0.78;
        pointer-events: auto;
      }

      .control-room::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          repeating-linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.032),
            rgba(255, 255, 255, 0.032) 1px,
            transparent 1px,
            transparent 4px
          ),
          radial-gradient(circle at 24% 20%, rgba(68, 112, 136, 0.24), transparent 24%);
        mix-blend-mode: screen;
        opacity: 0.42;
        pointer-events: none;
      }

      .three-mount {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: #090a0b;
      }

      .scene-effects {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .scene-frame {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
      }
      .scene-frame.is-entering {
        animation: scene-appear calc(var(--game-ui-motion-scene) * 3) ease-out both;
      }
      .scene-signals {
        position: absolute;
        inset: 0;
        display: none;
        pointer-events: none;
      }
      .has-device:not([data-scene-image="fallback"]) .scene-signals {
        display: block;
      }
      .scene-signal,
      .scene-activation,
      .scene-arrival {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .scene-signal {
        border-radius: var(--game-ui-radius-round);
        mix-blend-mode: screen;
      }
      .scene-signal.is-red {
        color: var(--game-ui-signal-red);
      }
      .scene-signal.is-blue {
        color: var(--game-ui-signal-blue);
      }
      .scene-signal.is-red,
      .scene-signal.is-blue {
        opacity: 0.96;
        background:
          radial-gradient(
            ellipse at 36% 26%,
            color-mix(in srgb, var(--game-ui-text-bright) 60%, transparent) 0 7%,
            transparent 19%
          ),
          radial-gradient(
            ellipse at 50% 55%,
            color-mix(in srgb, var(--game-ui-text-bright) 50%, transparent) 0 5%,
            currentColor 30%,
            var(--game-ui-deep) 95%
          );
        border: 2px solid var(--game-ui-deep);
        transform: scale(0.78, 0.82);
        box-shadow: 0 0 var(--game-ui-space-9) currentColor;
      }
      .scene-activation.is-ready {
        opacity: 0.8;
        border-radius: 50%;
        background: var(--game-ui-focus);
        box-shadow: 0 0 var(--game-ui-space-9) var(--game-ui-focus);
        mix-blend-mode: screen;
      }
      .scene-arrival {
        border-radius: 50%;
        border: 2px solid var(--game-ui-signal-blue);
        box-shadow: 0 0 var(--game-ui-space-10) var(--game-ui-signal-blue);
      }
      .is-arriving .scene-arrival {
        animation: scene-arrive calc(var(--game-ui-motion-scene) * 3) ease-out both;
      }
      @keyframes scene-appear {
        from {
          opacity: 0;
          filter: brightness(2.2) saturate(0.2);
          clip-path: inset(75% 0 0);
        }
        55% {
          opacity: 0.75;
        }
        to {
          opacity: 1;
          filter: none;
          clip-path: inset(0);
        }
      }
      @keyframes scene-arrive {
        0% {
          opacity: 0;
          transform: scale(0.6);
        }
        30% {
          opacity: 0.7;
        }
        100% {
          opacity: 0;
          transform: scale(1.4);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .scene-frame.is-entering,
        .is-arriving .scene-arrival {
          animation: none;
        }
      }

      .three-mount[data-scene-image="fallback"] {
        background: transparent;
      }
      .control-room:has([data-scene-image="fallback"]) .scene-hotspot:not(.is-hidden),
      .control-room:has([data-scene-image="fallback"]) .display-hotspot {
        border: 1px solid var(--game-ui-line);
        background: var(--game-ui-panel);
        color: var(--game-ui-ink);
        left: 6% !important;
        top: 42% !important;
        width: 42% !important;
        height: auto !important;
        min-height: var(--game-ui-touch-target);
        padding: var(--game-ui-space-3);
        transform: none;
      }
      .control-room:has([data-scene-image="fallback"]) #kakejikuHotspot,
      .control-room:has([data-scene-image="fallback"]) #floorHotspot,
      .control-room:has([data-scene-image="fallback"]) #deviceHotspot {
        left: 52% !important;
      }
      .control-room:has([data-scene-image="fallback"]) #wallHotspot,
      .control-room:has([data-scene-image="fallback"]) #floorHotspot {
        top: calc(42% + var(--game-ui-touch-target) + var(--game-ui-space-8)) !important;
      }
      .control-room:has([data-scene-image="fallback"]) #floorCrackHotspot,
      .control-room:has([data-scene-image="fallback"]) #deviceHotspot {
        top: calc(42% + 2 * (var(--game-ui-touch-target) + var(--game-ui-space-8))) !important;
      }
      .display-hotspot,
      .scene-hotspot,
      .activation-button {
        -webkit-tap-highlight-color: transparent;
      }
      .control-room:has([data-scene-image="fallback"]) .scene-hotspot::after,
      .control-room:has([data-scene-image="fallback"]) .display-hotspot::after {
        content: attr(aria-label);
        font-size: var(--game-ui-font-size-xs);
        line-height: var(--game-ui-line-height-short);
      }

      .display-hotspot,
      .scene-hotspot {
        position: absolute;
        left: -999px;
        top: -999px;
        z-index: 4;
        width: 74px;
        height: 48px;
        border: 0;
        border-radius: 2px;
        background: transparent;
        cursor: pointer;
        appearance: none;
        transform: translate(-50%, -50%);
      }

      .scene-hotspot.is-hidden {
        display: none;
      }

      #wallHotspot,
      #floorHotspot {
        z-index: 4;
      }

      #kakejikuHotspot,
      #floorCrackHotspot {
        z-index: 6;
      }

      #displayHotspot,
      #deviceHotspot {
        z-index: 7;
      }

      .display-hotspot:focus-visible,
      .scene-hotspot:focus-visible {
        outline: 1px solid rgba(104, 180, 218, 0.72);
        outline-offset: 3px;
      }

      .control-room > .remaining,
      .control-room > .objective {
        position: absolute;
        right: clamp(16px, 3vw, 38px);
        top: calc(max(14px, env(safe-area-inset-top)) + 52px);
        z-index: 3;
        color: rgba(236, 228, 205, 0.82);
        font-family: var(--font-body);
        font-size: var(--game-ui-font-size-sm);
      }

      .game-menu-toggle {
        position: absolute;
        top: max(14px, env(safe-area-inset-top));
        right: max(16px, env(safe-area-inset-right));
        z-index: 12;
        min-height: var(--game-ui-touch-target);
        padding: 0 var(--game-ui-space-8);
        border: 1px solid var(--game-ui-menu-toggle-border);
        border-radius: var(--game-ui-radius-sm);
        background: var(--game-ui-menu-toggle-surface);
        color: var(--game-ui-text-control);
        font-family: var(--font-body);
        font-size: var(--game-ui-font-size-sm);
        cursor: pointer;
      }

      .game-menu-card {
        width: min(86vw, 360px);
      }

      .game-menu-actions {
        display: grid;
        gap: var(--game-ui-space-4);
      }

      .game-menu-actions button {
        width: 100%;
        text-align: left;
      }

      .game-menu-actions .is-hidden {
        display: none;
      }

      .repair-record-card,
      .game-menu-card {
        max-height: calc(100dvh - 48px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        overflow-y: auto;
        overscroll-behavior: contain;
      }

      .repair-answer {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: var(--game-ui-space-3);
        margin: var(--game-ui-space-4) 0 var(--game-ui-space-10);
      }

      .repair-record-caption {
        margin: 0;
        color: var(--game-ui-muted);
        font-size: var(--game-ui-font-size-sm);
      }

      .app[inert] .game-menu-toggle {
        opacity: 0;
      }

      .scene-dialog-layer {
        position: fixed;
        inset: 0;
        z-index: 17;
        display: grid;
        place-items: center;
        background: color-mix(in srgb, var(--game-ui-deep) 46%, transparent);
        overscroll-behavior: contain;
      }

      .puzzle-card {
        position: relative;
        width: min(calc(var(--spacing) * 112), calc(100vw - var(--spacing) * 8));
        max-height: calc(100% - 32px);
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: calc(var(--spacing) * 6);
        border: 1px solid var(--game-ui-dialog-border);
        border-radius: var(--game-ui-radius-sm);
        background: linear-gradient(180deg, var(--game-ui-surface-raised), var(--game-ui-deep));
        color: var(--game-ui-ink);
        box-shadow: var(--game-ui-elevation-dialog);
        backdrop-filter: blur(2px);
      }

      .puzzle-panel.is-hidden,
      .device-panel.is-hidden {
        display: none;
      }

      .puzzle-title {
        margin-bottom: calc(var(--spacing) * 2);
        color: rgba(229, 184, 127, 0.9);
        font-family: var(--font-display);
        font-size: var(--game-ui-font-size-heading);
        font-weight: normal;
        text-align: left;
      }

      .puzzle-lines {
        display: grid;
        gap: calc(var(--spacing) * 2);
        margin-bottom: calc(var(--spacing) * 5);
        font-family: var(--font-body);
        font-size: var(--game-ui-font-size-md);
        line-height: var(--game-ui-line-height-compact);
        text-align: center;
      }

      .trace-caption {
        display: none;
        color: rgba(229, 184, 127, 0.82);
        font-size: 0.82em;
        letter-spacing: 0.08em;
        text-align: left;
      }

      .trace-row {
        display: grid;
        grid-template-columns: 3em minmax(0, 1fr);
        align-items: center;
        gap: calc(var(--spacing) * 4);
        padding: calc(var(--spacing) * 2) 0;

      .chip.mark2 {

      .puzzle-form {

      .puzzle-form input {

      .puzzle-form .send-btn {

      .word-bank {

      .word-bank button {

        border-radius: 2px;

      .word-bank button.is-selected {

      .word-bank button[data-answer] {

      .puzzle-status {
        min-height: 1.35em;

      .device-panel::before,

      .lamp-row {

      .lamp {

          inset 0 6px 12px rgba(255, 255, 255, 0.2),

      .lamp.is-blue {

          radial-gradient(circle at 35% 27%, rgba(244, 250, 255, 0.88), transparent 14%),

          inset 0 6px 12px rgba(255, 255, 255, 0.2),

      .device-plate {

          linear-gradient(180deg, rgba(55, 49, 39, 0.8), rgba(15, 13, 12, 0.82)),
          repeating-linear-gradient(
            0deg,
            rgba(255, 238, 203, 0.04),
            rgba(255, 238, 203, 0.04) 1px,
            transparent 1px,
            transparent 10px
          );
        color: rgba(238, 226, 204, 0.92);
        box-shadow:
          inset 0 0 24px rgba(0, 0, 0, 0.58),
          0 18px 38px rgba(0, 0, 0, 0.28);
        pointer-events: auto;
        backdrop-filter: blur(2px);
      }

      .device-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: calc(var(--spacing) * 3);
        margin-bottom: calc(var(--spacing) * 2);
      }

      .device-heading .device-title {
        margin: 0;
      }
      .device-close.book-button {
        width: var(--game-ui-touch-target);
        min-height: var(--game-ui-touch-target);
        padding: 0;
        font-size: var(--game-ui-font-size-close);
        background: transparent;
        color: inherit;
        border-color: transparent;
      }

      .device-title {
        margin-bottom: calc(var(--spacing) * 2);
        color: rgba(229, 184, 127, 0.88);
        font-family: var(--font-display);
        font-weight: normal;
        text-align: left;
        font-size: var(--game-ui-font-size-heading);
      }

      .device-panel .log,
      .device-panel .device-copy {
        max-height: 160px;
        padding: 0;
        color: rgba(241, 232, 214, 0.94);
        font-family: var(--font-body);
        font-size: var(--game-ui-font-size-md);
        line-height: var(--game-ui-line-height);
        text-align: left;
        white-space: pre-line;
      }

      .activation-button {
        display: block;
        min-width: 104px;
        min-height: var(--game-ui-touch-target);
        margin: 20px auto 0;
        padding: 0 20px;
        border: 1px solid rgba(188, 164, 126, 0.46);
        border-radius: 2px;
        background:
          radial-gradient(circle at 50% 12%, rgba(255, 255, 255, 0.16), transparent 26%),

        color: rgba(241, 232, 214, 0.7);
        font-family: var(--font-body);
        font-weight: normal;
        letter-spacing: 0;

        box-shadow:

        font-size: var(--game-ui-font-size-md);
        margin-top: calc(var(--spacing) * 4);
      }

      .device-panel.is-available .activation-button {
        border-color: rgba(159, 231, 155, 0.68);
        background:
          radial-gradient(circle at 50% 12%, rgba(255, 255, 255, 0.32), transparent 26%),
          linear-gradient(180deg, #47724a, #152916);
        color: #efffe9;
        box-shadow:
          inset 0 2px 0 rgba(255, 255, 255, 0.16),
          inset 0 -8px 14px rgba(0, 0, 0, 0.46),
          0 5px 0 #071007,
          0 0 24px rgba(115, 220, 101, 0.42);
      }

      .device-line {
        white-space: pre-line;
        text-align: center;
      }

      .device-line + .device-line {
        margin-top: 12px;
      }

      .device-line.user {
        color: rgba(176, 193, 210, 0.7);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.92rem;
      }

      .device-panel .composer {
        position: relative;
        z-index: 1;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 10px;
        padding: 0;
        border-top: 0;
        background: transparent;
        pointer-events: auto;
      }

      .device-panel input {
        border-radius: 2px;
        border-color: rgba(224, 188, 131, 0.28);
        background: rgba(3, 3, 3, 0.38);
      }

      .device-panel .send-btn,
      .device-panel .icon-btn {
        border-radius: 2px;
        border-color: rgba(224, 188, 131, 0.34);
        background: rgba(33, 25, 18, 0.82);
        color: rgba(241, 226, 200, 0.9);
      }

      .device-panel .send-btn {
        width: 58px;
      }

      .device-panel .reset-btn {
        width: auto;
        min-width: 82px;
      }

      .device-panel .send-btn:hover,
      .device-panel .icon-btn:hover {
        border-color: rgba(224, 188, 131, 0.72);
        background: rgba(82, 55, 32, 0.82);
      }

      .memo-text {
        white-space: pre-line;
        line-height: var(--game-ui-line-height);
        font-size: var(--game-ui-font-size-md);
      }

      .memo-close,
      .title-return {
        min-height: var(--game-ui-touch-target);
        margin-top: 18px;
        padding: 0 18px;
        border: 1px solid rgba(35, 24, 15, 0.44);
        border-radius: 2px;
        background: rgba(38, 25, 14, 0.88);
        color: #f2e7d1;
        cursor: pointer;
      }

      .flavor-layer {
        position: fixed;
        inset: 0;
        z-index: 17;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(2, 2, 2, 0.46);
        cursor: pointer;
      }

      .flavor-layer.is-hidden {
        display: none;
      }

      .flavor-card {
        width: min(86vw, 520px);
        padding: calc(var(--spacing) * 6);
        border: 1px solid rgba(184, 159, 113, 0.54);
        border-radius: 2px;
        background: linear-gradient(180deg, rgba(41, 35, 27, 0.96), rgba(13, 12, 11, 0.98));
        color: rgba(242, 231, 209, 0.94);
        font-family: var(--font-body);
        line-height: var(--game-ui-line-height);
        text-align: left;
        box-shadow: 0 24px 82px rgba(0, 0, 0, 0.62);
        cursor: default;
        font-size: var(--game-ui-font-size-md);
      }

      .flavor-title {
        margin-bottom: 10px;
        color: rgba(229, 184, 127, 0.94);
        font-weight: normal;
        font-family: var(--font-display);
        font-size: var(--game-ui-font-size-heading);
      }

      .flavor-title.is-hidden {
        display: none;
      }

      .flavor-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }

      .flavor-action {
        min-height: var(--game-ui-touch-target);
        padding: 0 16px;
        border: 1px solid rgba(224, 188, 131, 0.52);
        border-radius: 2px;
        background: rgba(74, 50, 30, 0.88);
        color: #f8ead1;
        cursor: pointer;
      }

      .flavor-action.is-hidden {
        display: none;
      }

      .flavor-close {
        min-height: var(--game-ui-touch-target);
        padding: 0 16px;
        border: 1px solid rgba(184, 159, 113, 0.38);
        border-radius: 2px;
        background: rgba(12, 10, 8, 0.66);
        color: rgba(242, 231, 209, 0.88);
        cursor: pointer;
      }

      .terminal-flash {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        z-index: 20;
        background: #050606;
        color: #ff1e4d;
        font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
        font-size: clamp(3.5rem, 15vw, 10rem);
        font-weight: 900;
        text-align: center;
        letter-spacing: 0;
        text-shadow: 0 0 28px rgba(255, 30, 77, 0.76);
      }

      .terminal-flash.is-visible {
        display: grid;
        animation: doom 800ms steps(2, end) infinite;
      }

      .clear-stage {
        position: fixed;
        inset: 0;
        display: none;
        z-index: 30;
        overflow: hidden;
        background:
          radial-gradient(
            ellipse at 50% 42%,
            rgba(246, 244, 220, 0.95) 0 8%,
            rgba(151, 198, 210, 0.78) 18%,
            rgba(16, 28, 32, 0.88) 38%,
            #030405 68%
          ),
          #030405;
        color: #f7f1dc;
      }

      .clear-stage.video-failed {
        background:
          radial-gradient(circle at 50% 46%, rgba(255, 252, 170, 0.96), transparent 10%),
          radial-gradient(circle at 49% 48%, rgba(255, 91, 52, 0.92), transparent 20%),
          radial-gradient(circle at 51% 52%, rgba(68, 216, 255, 0.58), transparent 32%), #091018;
      }

      .clear-stage.is-visible {
        display: grid;
        place-items: center;
        animation: exit-open 3000ms ease-out both;
      }

      .clear-stage.is-settled {
        animation: none;
      }

      .explosion-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        filter: saturate(0.95) contrast(1.08) brightness(0.74);
        transform: scale(1.02);
      }

      .clear-stage.is-visible .explosion-video {
        opacity: 0;
      }

      .clear-stage::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px) 0 0 / 7px 100%,
          linear-gradient(180deg, rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.42));
        opacity: 0;
        animation: glitch-clear 2200ms ease-out both;
        pointer-events: none;
      }

      .clear-stage::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: 1;
        width: min(36vw, 280px);
        height: min(58vh, 460px);
        transform: translate(-50%, -50%);
        border: 1px solid rgba(255, 255, 255, 0.74);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(201, 239, 250, 0.72));
        box-shadow:
          0 0 80px rgba(219, 247, 255, 0.78),
          0 0 180px rgba(219, 247, 255, 0.46);
      }

      .server {
        display: none;
      }

      .server::before,
      .server::after {
        content: none;
      }

      .server::after {
        background: rgba(255, 55, 111, 0.86);
        animation-delay: 140ms;
      }

      .clear-word {
        position: relative;
        z-index: 2;
        margin: 0;
        font-family: var(--font-display);
        font-size: calc(var(--game-ui-font-size-heading) * 2);
        line-height: var(--game-ui-line-height-compact);
        letter-spacing: 0;
        color: #f5ead0;
        text-shadow: 0 3px 16px rgba(0, 0, 0, 0.8);
      }

      .clear-caption {
        margin: calc(var(--spacing) * 2) 0 calc(var(--spacing) * 5);
        font-family: var(--font-body);
        font-size: var(--game-ui-font-size-md);
        line-height: var(--game-ui-line-height);
      }

      .clear-summary {
        position: relative;
        z-index: 3;
        width: min(calc(var(--spacing) * 112), calc(100vw - var(--spacing) * 8));
        max-height: calc(100dvh - var(--spacing) * 8);
        overflow-y: auto;
        padding: calc(var(--spacing) * 6);
        border-radius: var(--radius-panel);
        background: var(--game-ui-deep);
        color: var(--game-ui-ink);
        text-align: center;
      }

      .clear-actions {
        display: grid;
        gap: calc(var(--spacing) * 3);
      }

      .clear-actions .book-button {
        display: grid;
        place-items: center;
        margin: 0;
        padding: calc(var(--spacing) * 2) calc(var(--spacing) * 4);
        min-height: var(--game-ui-touch-target);
        font-family: var(--font-body);
        font-size: var(--game-ui-font-size-md);
        line-height: var(--game-ui-line-height-compact);
        color: inherit;
        background: transparent;
        border-color: currentColor;
        text-decoration: none;
      }

      .title-return {
        position: static;
        transform: none;
      }

      @keyframes doom {
        0%,
        100% {
          filter: contrast(1);
          transform: translate(0, 0);
        }
        50% {
          filter: contrast(1.8);
          transform: translate(3px, -2px);
        }
      }

      @keyframes reveal-scroll {
        0% {
          --chat-alpha: 0.52;
          --chrome-alpha: 0.68;
        }
        55% {
          --chat-alpha: 0.28;
          --chrome-alpha: 0.42;
        }
        100% {
          --chat-alpha: 0.1;
          --chrome-alpha: 0.22;
        }
      }

      @keyframes quake {
        0%,
        100% {
          transform: translate(0, 0) rotate(0deg);
        }
        18% {
          transform: translate(-14px, 9px) rotate(-1deg);
        }
        36% {
          transform: translate(13px, -11px) rotate(1deg);
        }
        54% {
          transform: translate(-10px, -7px) rotate(0.7deg);
        }
        72% {
          transform: translate(16px, 8px) rotate(-0.8deg);
        }
      }

      @keyframes exit-open {
        0% {
          filter: contrast(1.8) brightness(0.72);
        }
        18% {
          filter: contrast(2.5) brightness(1.35);
          transform: translate(4px, -3px);
        }
        38% {
          filter: contrast(1.25) brightness(1.08);
          transform: translate(-2px, 2px);
        }
        100% {
          filter: contrast(1) brightness(1);
          transform: translate(0, 0);
        }
      }

      @keyframes glitch-clear {
        0% {
          opacity: 0.9;
          transform: translateX(-18px);
        }
        45% {
          opacity: 0.36;
          transform: translateX(8px);
        }
        100% {
          opacity: 0;
          transform: translateX(0);
        }
      }

      .puzzle-description {
        margin: 0 0 calc(var(--spacing) * 5);
        font-family: var(--font-body);
        font-size: var(--game-ui-font-size-md);
        line-height: var(--game-ui-line-height);
      }

      .word-bank #puzzleHintButton:not(.is-hidden) {
        grid-column: 1 / -1;
      }

      .device-panel.is-revealing .device-plate {
        animation: device-plate-enter var(--game-ui-motion-scene) ease-out both;
        animation-delay: calc(var(--game-ui-motion-scene) * 2);
      }

      @keyframes device-plate-enter {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 680px) {
        .app {
          height: 100dvh;
          padding: 0;
        }

        .control-room {
          height: 100dvh;
          padding: 0;
        }

        .control-room > .objective {
          right: 12px;
          top: calc(max(14px, env(safe-area-inset-top)) + 52px);
          max-width: 42vw;

          text-align: right;
        }

        .puzzle-card {
          max-height: calc(100dvh - 28px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        }

        .trace-caption {
          display: none;
        }

        .target-row {
          font-size: 0.82rem;
        }

        .puzzle-form {
          gap: 8px;
        }

        .device-panel .device-copy {
          max-height: 132px;
        }

        .activation-button {
          min-width: 96px;
        }

        .flavor-card {
          width: min(92vw, 480px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .chat-shell {
          --chat-alpha: 0.52;
          --chrome-alpha: 0.68;
          animation: none;
        }

        .terminal-flash.is-visible,
        .clear-stage.is-visible,
        .server,
        .server::before,
        .server::after {
          animation: none !important;
        }

        .explosion-video {
          transform: none;
        }

        .device-panel.is-revealing .device-plate {
          animation: none;
        }

        * {
          scroll-behavior: auto !important;
          transition-duration: 1ms !important;
        }
      }
    </style>
  </head>

          aria-label="壊れたディスプレイを調べる"

    <script src="build/completion-record-9e1d0e5b847e7b0f8ac8a9654c7fdf6baf83c1f78a68713bab5e65052b1e304a.js?v=9e1d0e5b847e7b0f8ac8a9654c7fdf6baf83c1f78a68713bab5e65052b1e304a"></script>
    <script src="build/inspection-dialog.js"></script>
    <script src="build/room-scene.js"></script>
    <script>
      (() => {
        const objective = document.querySelector(".objective");
        const gameMenuButton = document.getElementById("gameMenuButton");
        const gameMenuLayer = document.getElementById("gameMenuLayer");
        const gameMenuClose = document.getElementById("gameMenuClose");
        const restartButton = document.getElementById("restartButton");
        const repairRecordButton = document.getElementById("repairRecordButton");
        const repairRecordLayer = document.getElementById("repairRecordLayer");
        const repairRecordClose = document.getElementById("repairRecordClose");
        const repairAnswer = "再再再逆逆";
        const puzzlePanel = document.getElementById("puzzlePanel");
        const puzzleForm = document.getElementById("puzzleForm");
        const puzzleInput = document.getElementById("puzzleInput");
        const puzzleStatus = document.getElementById("puzzleStatus");
        const puzzleHintButton = document.getElementById("puzzleHintButton");
        const devicePanel = document.getElementById("devicePanel");
        const deviceCopy = document.getElementById("deviceCopy");
        const deviceColorClue = "修復した記録の色に、灯りをそろえよ。";
        const deviceClose = document.getElementById("deviceClose");
        const activationButton = document.getElementById("activationButton");
        const displayHotspot = document.getElementById("displayHotspot");
        const kakejikuHotspot = document.getElementById("kakejikuHotspot");
        const wallHotspot = document.getElementById("wallHotspot");
        const floorHotspot = document.getElementById("floorHotspot");
        const floorCrackHotspot = document.getElementById("floorCrackHotspot");
        const deviceHotspot = document.getElementById("deviceHotspot");
        const completionAttempt =
          AkashicCompletion.createCompletionAttempt("three-forward-two-back");
        const clearStage = document.getElementById("clearStage");
        const explosionVideo = document.getElementById("explosionVideo");
        const memoLayer = document.getElementById("memoLayer");
        const memoText = document.getElementById("memoText");
        const memoClose = document.getElementById("memoClose");
        const flavorLayer = document.getElementById("flavorLayer");
        const flavorTitle = document.getElementById("flavorTitle");
        const flavorText = document.getElementById("flavorText");
        const flavorAction = document.getElementById("flavorAction");
        const flavorClose = document.getElementById("flavorClose");
        const titleReturn = document.getElementById("titleReturn");
        const threeMount = document.getElementById("threeMount");
        const app = document.getElementById("app");
        const lamps = [
          document.getElementById("lamp0"),
          document.getElementById("lamp1"),
          document.getElementById("lamp2"),
        ];
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
        const motionToken = getComputedStyle(threeMount)
          .getPropertyValue("--game-ui-motion-scene")
          .trim();
        const deviceRevealDuration =
          (Number.parseFloat(motionToken) || 0) * (motionToken.endsWith("ms") ? 1 : 1000) * 3;
        let deviceRevealTimer = null;
        const minRouteDepth = -3;
        const maxRouteDepth = 0;
        const routeStorageKey = "akashic.three-forward.reload-route.v1";
        let historyFailed = false;
        let runId = `${Date.now()}-${Math.random().toString(36).slice(2)}`;

        const state = {
          forward: 0,
          back: 0,
          routeDepth: 0,
          routeValid: true,
          started: false,
          historyReady: false,
          deviceRevealed: false,
          escapeArmed: false,
          kakejikuChecks: 0,
          browserHintSeen: false,
          puzzleHintShown: false,
          puzzleHintStep: 0,
          hintUsed: false,
          ended: false,
          puzzleDraft: "",
        };
        const isValidPuzzleDraft = (draft) =>
          typeof draft === "string" && draft.length <= 5 && /^[再逆]*$/.test(draft);
        const readCheckpoint = AkashicRoomScene.readCheckpoint;
        const initialCheckpoint = { ...state };
        function applyCheckpoint(saved) {
          Object.assign(state, initialCheckpoint);
          if (!saved) return;
          Object.assign(state, {
            started: saved.started,
            deviceRevealed: saved.deviceRevealed,
            escapeArmed: saved.escapeArmed,
            ended: saved.ended,
            kakejikuChecks: saved.kakejikuChecks,
            puzzleHintShown: saved.puzzleHintShown,
            puzzleHintStep: saved.puzzleHintStep,
            hintUsed: saved.hintUsed,
            browserHintSeen: saved.browserHintSeen,
            puzzleDraft:
              saved.deviceRevealed || saved.ended || !isValidPuzzleDraft(saved.puzzleDraft)
                ? ""
                : saved.puzzleDraft,
          });
          if (state.hintUsed) completionAttempt.hint();
          // Restore the durable checkpoint; the tab ledger restores navigation below.
          state.forward = state.escapeArmed ? 3 : 0;
          state.back = state.escapeArmed ? 2 : 0;
          state.routeDepth = 0;
          state.routeValid = true;
        }
        const savedProgress = readCheckpoint();
        applyCheckpoint(savedProgress);
        globalThis.AkashicTelemetrySemanticGame = "three-forward-two-back";
        const telemetry = (() => {
          try {
            return globalThis.AkashicTelemetry?.init({ gameId: "three-forward-two-back" });
          } catch {
            return null;
          }
        })();
        function telemetryPosition() {
          if (state.ended) return { stage: "escaped", step: 3 };
          if (state.escapeArmed) return { stage: "escape-ready", step: 2 };
          if (state.deviceRevealed) return { stage: "device-repaired", step: 1 };
          return { stage: "exploring", step: 0 };
        }
        function trackTelemetry(event) {
          const { stage, step } = telemetryPosition();
          try {
            telemetry?.[event]?.(stage, step);
          } catch {
            // Optional measurement must not interrupt gameplay.
          }
        }
        let lastTelemetryMilestone = telemetryPosition().stage;
        puzzleInput.value = state.puzzleDraft;
        const roomScene = AkashicRoomScene.create({
          mount: threeMount,
          reducedMotion,
          initialVisible: state.deviceRevealed,
          hotspots: {
            display: displayHotspot,
            kakejiku: kakejikuHotspot,
            wall: wallHotspot,
            floor: floorHotspot,
            crack: floorCrackHotspot,
            device: deviceHotspot,
          },
        });
        function saveProgress() {
          window.AkashicProgress.writeProgress("three-forward-two-back", {
            started: Boolean(state.started),
            deviceRevealed: state.deviceRevealed,
            escapeArmed: state.escapeArmed,
            ended: state.ended,
            kakejikuChecks: state.kakejikuChecks,
            puzzleHintShown: state.puzzleHintShown,
            puzzleHintStep: state.puzzleHintStep,
            hintUsed: state.hintUsed,
            browserHintSeen: state.browserHintSeen,
            puzzleDraft: state.puzzleDraft,
          });
          saveRouteLedger();
          const milestone = telemetryPosition().stage;
          if (state.started && !state.ended && milestone !== lastTelemetryMilestone) {
            trackTelemetry("progress");
            lastTelemetryMilestone = milestone;
          }
        }
        let flavorActionHandler = null;
        const blockRevealInput = (event) => {
          if (deviceRevealTimer === null) return;
          event.preventDefault();
          event.stopImmediatePropagation();
        };
        // Register before the dialog's focus helper; pointerdown also owns focus.
        app.addEventListener("pointerdown", blockRevealInput, { capture: true });
        app.addEventListener("click", blockRevealInput, { capture: true });
        let returnSceneDialog = null;
        const inspection = AkashicInspection.create({
          root: document.getElementById("app"),
          layers: [
            memoLayer,
            flavorLayer,
            gameMenuLayer,
            repairRecordLayer,
            puzzlePanel,
            devicePanel,
          ],
          onClose() {
            const resume = returnSceneDialog;
            returnSceneDialog = null;
            if (!resume || state.ended) return;
            inspection.open(resume.layer);
            if (resume.opener?.isConnected) resume.opener.focus({ preventScroll: true });
          },
        });
        const puzzleHints = [
          "中間は、起点から同じ操作を3回受けた状態。",
          "終端は、中間から右側の2つだけが「逆」に変わった状態。",
          "入力できる文字は「再」と「逆」だけ。",
        ];

        explosionVideo.addEventListener("error", () => {
          clearStage.classList.add("video-failed");
        });

        app.inert = state.ended;
        app.addEventListener("click", (event) => {
          if (event.target.closest("#gameMenuButton")) return;
          if (state.ended) return;
          trackTelemetry("start");
          if (!state.started) {
            state.started = true;
            saveProgress();
          }
        });
        app.addEventListener("click", prepareHistoryOnInteraction, { capture: true });
        function renderCheckpoint() {
          returnSceneDialog = null;
          closeLayer(puzzlePanel);
          closeLayer(devicePanel);
          closeLayer(memoLayer);
          closeLayer(flavorLayer);
          closeLayer(gameMenuLayer);
          closeLayer(repairRecordLayer);
          puzzleInput.value = state.puzzleDraft;
          puzzlePanel.classList.add("is-hidden");
          devicePanel.classList.add("is-hidden");
          clearStage.classList.remove("is-visible", "is-settled");
          app.inert = state.ended;
          puzzleHintButton.classList.toggle("is-hidden", !state.puzzleHintShown);
          if (state.deviceRevealed) {
            presentDevice(false);
            if (state.escapeArmed) armEscape();
          }
          if (state.ended) {
            clearStage.classList.add("is-visible", "is-settled");
            app.inert = true;
            titleReturn.focus({ preventScroll: true });
            const share = document.getElementById("clear-share");
            share.href = globalThis.AkashicCompletion.createShareIntent(
              "脱出に成功した。「忘れられた手順」" +
                (completionAttempt.noHints ? "\nノーヒントでクリアしました！" : ""),
              "https://games.escape-safari.com/three-forward-two-back/"
            );
          }
          if (!state.deviceRevealed) {
            roomScene.setDeviceVisible(false);
            threeMount.dataset.deviceState = "hidden";
          }
        }
        renderCheckpoint();
        updateHud();

        document.querySelectorAll(".word-bank button").forEach((button) => {
          button.addEventListener("click", () => {
            if (button.dataset.action === "hint") {
              showPuzzleHint();
              return;
            } else if (button.dataset.action === "backspace") {
              puzzleInput.value = puzzleInput.value.slice(0, -1);
            } else if (button.dataset.answer && puzzleInput.value.length < 5) {
              puzzleInput.value += button.dataset.answer;
            }
            puzzleStatus.textContent = "";
            document.querySelectorAll(".word-bank button").forEach((item) => {
              item.classList.remove("is-selected");
            });
            if (button.dataset.answer) button.classList.add("is-selected");
            state.puzzleDraft = puzzleInput.value;
            saveProgress();
          });
        });

        puzzleInput.addEventListener("input", () => {
          state.puzzleDraft = puzzleInput.value.slice(0, 5);
          saveProgress();
        });

        puzzleForm.addEventListener("submit", (event) => {
          event.preventDefault();
          if (state.ended) return;
          const answer = puzzleInput.value.trim().replace(/\s+/g, "");
          if (answer === repairAnswer) {
            revealDevice();
            return;
          }
          puzzleStatus.textContent = "不一致";
          trackTelemetry("wrong");
          if (!state.puzzleHintShown) {
            state.puzzleHintShown = true;
            state.puzzleHintStep = 0;
            puzzleHintButton.classList.remove("is-hidden");
          }
          saveProgress();
          puzzleInput.select();
        });

        activationButton.addEventListener("click", handleActivation);
        displayHotspot.addEventListener("click", () => {
          if (state.deviceRevealed) {
            showFlavor("復元済み。画面には古いノイズだけが残っている。");
            return;
          }
          revealPuzzle();
        });
        kakejikuHotspot.addEventListener("click", () => {
          if (!state.deviceRevealed) {
            showFlavor("「読み直すべし」と記されている。端に小さな書き込みがある。");
            return;
          }
          state.kakejikuChecks = Math.min(20, state.kakejikuChecks + 1);
          saveProgress();
          if (state.kakejikuChecks >= 2 && !state.browserHintSeen) {
            showFlavor("よく見ると端をめくれそうだ。", {
              actionLabel: "ヒントを見る",
              onAction: showBrowserHint,
            });
            return;
          }
          showFlavor("「読み直すべし」と記されている。端に小さな書き込みがある。");
        });
        wallHotspot.addEventListener("click", () => {
          showFlavor("煤けた壁。触れると黒い粉が指につく。");
        });
        floorHotspot.addEventListener("click", () => {
          showFlavor("冷たい床。足音だけが妙に大きく返る。");
        });
        floorCrackHotspot.addEventListener("click", () => {
          if (state.browserHintSeen) {
            showFlavor("亀裂にメモが挟まっている。", {
              title: "メモ",
              actionLabel: "読む",
              onAction: showNavigationHint,
            });
            return;
          }
          showFlavor("深い亀裂。奥は暗く、底が見えない。");
        });
        function openDevicePanel(event) {
          if (!state.routeValid && event?.isTrusted) {
            try {
              primeBrowserHistory();
            } catch {
              failHistory();
              return;
            }
          }
          if (!state.deviceRevealed || state.ended) return;
          openLayer(devicePanel);
          if (!devicePanel.inert) activationButton.focus({ preventScroll: true });
        }

        function closeDevicePanel() {
          closeLayer(devicePanel);
        }

        deviceHotspot.addEventListener("click", openDevicePanel);
        deviceClose.addEventListener("click", closeDevicePanel);
        document
          .getElementById("puzzleClose")
          .addEventListener("click", () => closeLayer(puzzlePanel));
        for (const layer of [
          puzzlePanel,
          devicePanel,
          memoLayer,
          flavorLayer,
          gameMenuLayer,
          repairRecordLayer,
        ]) {
          let startedOutside = false;
          layer.addEventListener("pointerdown", (event) => {
            startedOutside = event.target === layer;
          });
          layer.addEventListener("pointercancel", () => {
            startedOutside = false;
          });
          layer.addEventListener("click", (event) => {
            if (event.target === layer && startedOutside) closeLayer(layer);
            startedOutside = false;
            event.stopPropagation();
          });
        }

        memoClose.addEventListener("click", () => closeLayer(memoLayer));
        flavorClose.addEventListener("click", () => closeLayer(flavorLayer));

        flavorAction.addEventListener("click", () => {
          if (flavorActionHandler) flavorActionHandler();
        });

        gameMenuButton.addEventListener("click", () => {
          repairRecordButton.classList.toggle("is-hidden", !state.deviceRevealed);
          openLayer(gameMenuLayer);
        });
        for (const [layer, closeButton] of [
          [gameMenuLayer, gameMenuClose],
          [repairRecordLayer, repairRecordClose],
        ]) {
          closeButton.addEventListener("click", () => closeLayer(layer));
        }
        repairRecordButton.addEventListener("click", () => {
          if (!state.deviceRevealed) return;
          const answer = document.getElementById("repairAnswer");
          answer.replaceChildren(
            ...[...repairAnswer].map((character) => {
              const chip = document.createElement("span");
              chip.className = `chip ${character === "再" ? "mark1" : "mark2"}`;
              chip.textContent = character;
              return chip;
            })
          );
          const trace = puzzlePanel.querySelector(".puzzle-lines").cloneNode(true);
          document.getElementById("repairTrace").replaceChildren(trace);
          openLayer(repairRecordLayer);
        });
        restartButton.addEventListener("click", () => {
          showFlavor("修復した装置と、ここまでの進行をリセットします。", {
            title: "最初からやり直しますか？",
            actionLabel: "やり直す",
            onAction: restartGame,
            closeLabel: "キャンセル",
          });
        });

        async function restartGame() {
          trackTelemetry("reset");
          completionAttempt.reset();
          window.AkashicProgress.removeProgress("three-forward-two-back");
          try {
            sessionStorage.removeItem(routeStorageKey);
          } catch {}
          try {
            const url = new URL(location.href);
            url.searchParams.delete("_pstep");
            url.hash = "";
            history.replaceState(null, "", `${url.pathname}${url.search}`);
          } catch {}
          try {
            await telemetry?.flush();
          } catch {
            // A storage or analytics failure must not prevent restarting.
          }
          location.reload();
        }
        titleReturn.addEventListener("click", restartGame);

        window.addEventListener("popstate", () => restoreRoute());
        window.addEventListener("hashchange", () => restoreRoute());
        // Count this real navigation before load/pageshow; images must not gate feedback.
        const restoredRoute = restoreRoute();
        if (
          performance.getEntriesByType("navigation")[0]?.type === "reload" &&
          restoredRoute &&
          state.deviceRevealed &&
          !state.ended &&
          state.routeValid &&
          state.routeDepth === 0 &&
          state.back === 0 &&
          state.forward < 3
        ) {
          state.forward += 1;
          updateHud();
        }
        window.addEventListener("pageshow", (event) => {
          document.querySelector(".control-room").dataset.pageRestore = event.persisted
            ? "cache"
            : "document";
          if (event.persisted) {
            applyCheckpoint(readCheckpoint());
            renderCheckpoint();
            restoreRoute();
          }
        });

        function routeRecord(value) {
          return (
            value?.puzzle === "reload-back-v1" &&
            typeof value.puzzleRun === "string" &&
            value.puzzleRun.length <= 100 &&
            Number.isInteger(value.puzzleDepth) &&
            value.puzzleDepth >= minRouteDepth &&
            value.puzzleDepth <= maxRouteDepth
          );
        }

        function readRouteLedger() {
          try {
            const value = JSON.parse(sessionStorage.getItem(routeStorageKey));
            if (
              typeof value?.run !== "string" ||
              !Number.isInteger(value.depth) ||
              value.depth < minRouteDepth ||
              value.depth > maxRouteDepth ||
              !Number.isInteger(value.forward) ||
              value.forward < 0 ||
              value.forward > 3 ||
              !Number.isInteger(value.back) ||
              value.back < 0 ||
              value.back > 2 ||
              (value.back > 0 && value.forward !== 3) ||
              typeof value.valid !== "boolean"
            )
              return null;
            return value;
          } catch {
            return null;
          }
        }

        function saveRouteLedger() {
          if (!state.historyReady) return false;
          try {
            sessionStorage.setItem(
              routeStorageKey,
              JSON.stringify({
                run: runId,
                depth: state.routeDepth,
                forward: state.forward,
                back: state.back,
                valid: state.routeValid,
              })
            );
            return true;
          } catch {
            return false;
          }
        }

        function restoreRoute() {
          const current = history.state;
          const ledger = readRouteLedger();
          if (!routeRecord(current) || !ledger || current.puzzleRun !== ledger.run) {
            state.historyReady = false;
            return false;
          }
          runId = ledger.run;
          state.historyReady = true;
          state.forward = state.escapeArmed ? 3 : ledger.forward;
          state.back = state.escapeArmed ? 2 : ledger.back;
          state.routeValid = ledger.valid;
          const depth = current.puzzleDepth;
          if (depth !== ledger.depth && state.deviceRevealed && !state.escapeArmed) {
            if (depth === 0) {
              state.forward = 0;
              state.back = 0;
              state.routeValid = true;
            } else if (depth < ledger.depth && state.forward === 3 && state.routeValid) {
              state.back = Math.min(2, state.back + ledger.depth - depth);
              if (state.back === 2) armEscape();
            } else {
              state.routeValid = false;
            }
          }
          state.routeDepth = depth;
          updateHud();
          return true;
        }

        function prepareHistoryOnInteraction(event) {
          if (event.target.closest("#gameMenuButton")) return;
          if (!event.isTrusted || state.ended || state.historyReady || historyFailed) return;
          // Controls can be used before image loading finishes and pageshow runs.
          // Resume this tab's existing route before preparing a new history run.
          if (restoreRoute()) return;
          try {
            primeBrowserHistory();
          } catch {
            failHistory();
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }

        function primeBrowserHistory() {
          // Prepare only Back checkpoints while this document has trusted activation.
          // Reloads keep the current entry; they never append or traverse history.
          runId = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
          history.replaceState(
            { puzzle: "reload-back-v1", puzzleRun: runId, puzzleDepth: minRouteDepth },
            "",
            stepUrl(minRouteDepth)
          );
          for (let depth = minRouteDepth + 1; depth <= maxRouteDepth; depth += 1) {
            history.pushState(
              { puzzle: "reload-back-v1", puzzleRun: runId, puzzleDepth: depth },
              "",
              stepUrl(depth)
            );
          }
          state.historyReady = true;
          state.routeDepth = 0;
          state.forward = state.escapeArmed ? 3 : 0;
          state.back = state.escapeArmed ? 2 : 0;
          state.routeValid = true;
          if (!saveRouteLedger()) throw Error("Route storage is unavailable");
          updateHud();
        }

        function failHistory() {
          historyFailed = true;
          state.historyReady = false;
          showFlavor(
            "このブラウザでは手順を保存できませんでした。Chrome・Safariなどのブラウザで開き直してください。",
            {
              title: "操作できません",
            }
          );
        }

        function stepUrl(depth) {
          const url = new URL(location.href);
          url.searchParams.set("_pstep", String(depth));
          url.hash = `step-${depth}`;
          return `${url.pathname}${url.search}${url.hash}`;
        }

        // Presentation is transient; the repaired checkpoint is saved immediately.
        function finishDeviceAppearance(restoreFocus = false) {
          window.clearTimeout(deviceRevealTimer);
          deviceRevealTimer = null;
          devicePanel.classList.remove("is-revealing");
          devicePanel.inert = false;
          threeMount.dataset.deviceState = state.deviceRevealed ? "ready" : "hidden";
          roomScene.setDeviceVisible(state.deviceRevealed);
          if (
            restoreFocus &&
            state.deviceRevealed &&
            !state.ended &&
            !app.inert &&
            memoLayer.classList.contains("is-hidden") &&
            flavorLayer.classList.contains("is-hidden") &&
            (puzzlePanel.contains(document.activeElement) ||
              document.activeElement === displayHotspot ||
              document.activeElement === document.body)
          )
            (devicePanel.classList.contains("is-hidden") ? deviceHotspot : activationButton).focus({
              preventScroll: true,
            });
        }

        function presentDevice(animate) {
          window.clearTimeout(deviceRevealTimer);
          const moving = animate && !reducedMotion.matches && deviceRevealDuration > 0;
          devicePanel.classList.toggle("is-revealing", moving);
          devicePanel.inert = moving;
          threeMount.dataset.deviceState = moving ? "revealing" : "ready";
          roomScene.setDeviceVisible(true, moving, deviceRevealDuration);
          if (moving)
            deviceRevealTimer = window.setTimeout(
              () => finishDeviceAppearance(true),
              deviceRevealDuration
            );
          else finishDeviceAppearance(animate);
        }

        reducedMotion.addEventListener("change", () => {
          if (reducedMotion.matches && deviceRevealTimer !== null) finishDeviceAppearance(true);
        });
        window.addEventListener("pagehide", () => finishDeviceAppearance());

        function revealDevice() {
          if (state.deviceRevealed) return;
          state.deviceRevealed = true;
          state.puzzleDraft = "";
          puzzleInput.value = "";
          state.forward = 0;
          state.back = 0;
          state.routeDepth = 0;
          state.routeValid = true;
          state.escapeArmed = false;
          returnSceneDialog = null;
          closeLayer(puzzlePanel);
          closeLayer(devicePanel);
          devicePanel.classList.remove("is-available");
          presentDevice(true);
          roomScene.setActivationReady(false);
          updateHud();
          if (state.historyReady && history.state.puzzleDepth !== 0) {
            try {
              primeBrowserHistory();
            } catch {
              failHistory();
            }
          }
        }

        function revealPuzzle() {
          if (state.deviceRevealed || state.ended) return;
          openLayer(puzzlePanel);
        }

        function updateHud() {
          saveProgress();
          if (!state.deviceRevealed) {
            objective.textContent = "脱出経路：未確定";
          } else {
            objective.textContent = state.escapeArmed ? "脱出経路：開放" : "目標：装置を起動";
          }
          document.querySelector(".control-room").dataset.routeDepth = String(state.routeDepth);
          if (state.deviceRevealed && !state.escapeArmed) {
            deviceCopy.textContent = !state.routeValid
              ? "手順が途切れた。\n装置を調べ直せ。"
              : deviceColorClue;
          }
          updateLamps();
        }

        function updateLamps() {
          lamps.forEach((lamp) => {
            lamp.classList.remove("is-red", "is-blue");
          });

          const redCount = Math.min(3, Math.max(0, state.forward));
          for (let i = 0; i < redCount; i += 1) {
            lamps[i].classList.add("is-red");
          }

          if (state.forward >= 3 && state.back > 0) {
            const blueCount = Math.min(2, state.back);
            for (let i = 0; i < blueCount; i += 1) {
              lamps[2 - i].classList.remove("is-red");
              lamps[2 - i].classList.add("is-blue");
            }
          }
          roomScene.setLamps(
            lamps.map((lamp) => {
              if (lamp.classList.contains("is-blue")) return "blue";
              if (lamp.classList.contains("is-red")) return "red";
              return "off";
            })
          );
        }

        function armEscape() {
          state.escapeArmed = true;
          devicePanel.classList.add("is-available");
          deviceCopy.textContent = "脱出可能\n起動せよ";
          objective.textContent = "脱出経路：開放";
          roomScene.setActivationReady(true);
        }

        function showMemo() {
          memoText.textContent = deviceCopy.textContent;
          openLayer(memoLayer);
        }

        function openLayer(layer) {
          if (layer !== puzzlePanel && layer !== devicePanel && !returnSceneDialog) {
            const sceneLayer = [puzzlePanel, devicePanel].find(
              (item) => !item.classList.contains("is-hidden")
            );
            if (sceneLayer)
              returnSceneDialog = { layer: sceneLayer, opener: document.activeElement };
          }
          inspection.open(layer);
        }

        function closeLayer(layer) {
          inspection.close(layer);
        }

        function showFlavor(text, options = {}) {
          if (state.ended) return;
          flavorTitle.textContent = options.title || "";
          flavorTitle.classList.toggle("is-hidden", !options.title);
          flavorText.textContent = text;
          flavorActionHandler = typeof options.onAction === "function" ? options.onAction : null;
          flavorAction.textContent = options.actionLabel || "";
          flavorAction.classList.toggle("is-hidden", !flavorActionHandler);
          flavorClose.textContent = options.closeLabel || "閉じる";
          openLayer(flavorLayer);
        }

        function showPuzzleHint() {
          trackTelemetry("hint");
          state.hintUsed = true;
          saveProgress();
          completionAttempt.hint();
          const hasNext = state.puzzleHintStep < puzzleHints.length - 1;
          showFlavor(puzzleHints[state.puzzleHintStep], {
            title: "ヒント",
            actionLabel: hasNext ? "次のヒント" : "",
            onAction: hasNext
              ? () => {
                  state.puzzleHintStep += 1;
                  saveProgress();
                  showPuzzleHint();
                }
              : null,
          });
        }

        function showBrowserHint() {
          trackTelemetry("hint");
          state.hintUsed = true;
          completionAttempt.hint();
          state.browserHintSeen = true;
          saveProgress();
          showFlavor("読み直すとは、このページの再読み込み。戻るのは、ブラウザの戻る。", {
            title: "ヒント",
          });
        }

        function showNavigationHint() {
          trackTelemetry("hint");
          state.hintUsed = true;
          saveProgress();
          completionAttempt.hint();
          showFlavor(
            "再読み込みと戻るが見当たらなければ、ブラウザのメニューを探せ。手順を外したら、装置を調べ直せ。",
            {
              title: "メモ",
            }
          );
        }

        function handleActivation(event) {
          event.preventDefault();
          event.stopPropagation();
          if (state.ended || !state.deviceRevealed) return;
          if (state.escapeArmed) {
            clear();
            return;
          }
          showMemo();
        }

        function clear() {
          completionAttempt.complete();
          const share = document.getElementById("clear-share");
          share.href = globalThis.AkashicCompletion.createShareIntent(
            "脱出に成功した。「忘れられた手順」" +
              (completionAttempt.noHints ? "\nノーヒントでクリアしました！" : ""),
            "https://games.escape-safari.com/three-forward-two-back/"
          );
          returnSceneDialog = null;
          closeLayer(devicePanel);
          state.ended = true;
          trackTelemetry("clear");
          finishDeviceAppearance();
          saveProgress();
          clearStage.classList.add("is-visible");
          app.inert = true;
          titleReturn.focus({ preventScroll: true });
          explosionVideo.pause();
          window.setTimeout(() => {
            clearStage.classList.add("is-settled");
          }, 3000);
        }
      })();
    </script>
  </body>
</html>
