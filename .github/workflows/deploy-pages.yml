name: Legacy Pages deployment (retired)

on:
  workflow_dispatch: {}

# Keep an explicit refusal at the old workflow path so a manual run on the
# updated main branch explains why this partial publisher must not be used.
# Deployment ownership and remaining historical-ref risks are documented in
# .github/PAGES-DEPLOYMENT.md. No checkout, credentials, build, or publish step.
permissions: {}

jobs:
  refuse-legacy-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse the retired partial deployment
        run: |
          echo '::error::Legacy Pages deployment is retired: its six-route build can delete published games and replace robots.txt.'
          echo 'Use the reviewed Mirror legacy repos publication in emrum01/akashic; see .github/PAGES-DEPLOYMENT.md. This workflow publishes nothing.'
          exit 1
