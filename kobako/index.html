<meta name="description" content="ひらがなが並ぶ小さな箱。2つの例を見比べて、①②③を読もう。文字をタップして考える、SAFARIの一枚謎。">
















<style>
:root{--paper:#f4f0e7;--ink:#203a38;--panel:#fffdf8;--muted:#52635f;--line:#a9b8ad}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans CJK JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.65}
main{max-width:620px;margin:auto;padding:24px 12px 40px}header{border-bottom:1px solid var(--line);padding-bottom:16px}header p{margin:0}h1{font-size:30px;letter-spacing:.08em;margin:10px 0}h2{font-size:17px;margin:24px 0 10px}.brand{font-size:12px;letter-spacing:.15em;color:var(--muted)}.guide{font-size:14px;color:var(--muted);margin:12px 0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:10px 0;padding:8px 5px 10px}.box-head{display:flex;justify-content:space-between;align-items:center;padding:0 9px 6px;font-size:15px}.given{font-size:22px}.letters{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
button,input,summary{font:inherit}button{cursor:pointer;color:var(--ink);touch-action:manipulation}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #326eaa;outline-offset:3px}.tile{position:relative;min-width:0;min-height:50px;padding:3px 0;border:1px solid var(--line);border-radius:7px;background:var(--paper);font-size:24px;font-weight:600}.tile[aria-pressed="true"]{background:transparent;border-style:dashed}.tile[aria-pressed="true"] span{visibility:hidden}.tile[aria-pressed="true"]::after{content:"・";position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:18px}
.toolbar{display:flex;gap:8px;margin-top:18px}.action{min-height:46px;padding:8px 12px;border:1px solid var(--line);background:var(--panel);border-radius:8px}.action:disabled{opacity:.45;cursor:default}.answer{margin-top:28px}.answer label{display:block;margin-bottom:8px}.answer-line{display:flex;gap:8px}.answer input{width:0;min-width:0;flex:1;min-height:48px;font-size:20px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px}.primary{background:var(--ink);color:var(--panel)}#feedback{min-height:1.7em;margin:8px 0;color:var(--muted)}details{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}summary{min-height:44px;cursor:pointer;padding:6px 0}details p{font-size:15px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}footer{margin-top:26px;font-size:12px;color:var(--muted)}
@media(min-width:600px){main{padding:36px 24px}.tile{min-height:60px;font-size:28px}.box{padding:10px}.letters{gap:6px}}
/* Motion is transient; the hit targets and layout never animate. */
.tile span{display:inline-block;transform-origin:50% 70%}.tile,.action{-webkit-tap-highlight-color:transparent}
#effects{position:fixed;inset:0;z-index:20;pointer-events:none;overflow:hidden;contain:strict}
.fx{position:absolute;pointer-events:none}.fx-ghost{font-size:24px;font-weight:600;line-height:1;white-space:nowrap;color:var(--ink)}.fx-ring{width:46px;height:46px;border:2px solid #b39a62;border-radius:50%}.fx-bit{width:5px;height:9px;border-radius:2px;background:#b39a62}.fx-stamp{padding:12px 22px;border:2px solid #b39a62;border-radius:50%;background:var(--panel);color:var(--ink);font-size:24px;font-weight:700;white-space:nowrap;box-shadow:0 5px 18px #203a3818}
.answer[data-correct="true"] input{border:2px solid #8f793f;background:#fffaf0}
@media(prefers-reduced-motion:reduce){#effects{display:none}}
.tile:disabled{cursor:default;opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink)}
body:not(.ready) .interactive,body:not(.ready) .toolbar,body:not(.ready) .answer{display:none}
body.ready #static-note{display:none}
